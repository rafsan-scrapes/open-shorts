services:
  backend:
    build: .
    container_name: openshorts-backend
    expose:
      - "8000"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE=${WHISPER_COMPUTE:-int8}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-1}
    volumes:
      - output:/app/output
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    expose:
      - "5173"
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    expose:
      - "3100"
    volumes:
      - output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  output:
  hf_cache: